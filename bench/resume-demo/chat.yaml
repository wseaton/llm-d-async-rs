apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-poc-vllm
  labels: {app.kubernetes.io/part-of: resume-poc, app: resume-poc-vllm}
spec:
  replicas: 1
  selector: {matchLabels: {app: resume-poc-vllm}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: resume-poc, app: resume-poc-vllm}
    spec:
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:v0.30.0
          command: ["vllm", "serve"]
          args: ["Qwen/Qwen3-1.7B", "--port", "8000", "--max-model-len", "8192", "--enable-scale-out", "--reasoning-parser", "qwen3"]
          env:
            - {name: VLLM_BATCH_INVARIANT, value: "0"}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: "4", memory: 16Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "8", memory: 32Gi, nvidia.com/gpu: "1"}
          volumeMounts: [{name: shm, mountPath: /dev/shm}]
      volumes:
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 2Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: resume-poc-vllm
  labels: {app.kubernetes.io/part-of: resume-poc}
spec:
  selector: {app: resume-poc-vllm}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-poc-cutter
  labels: {app.kubernetes.io/part-of: resume-poc, app: resume-poc-cutter}
spec:
  replicas: 1
  selector: {matchLabels: {app: resume-poc-cutter}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: resume-poc, app: resume-poc-cutter}
    spec:
      containers:
        - name: cutter
          image: docker.io/library/python:3.12-slim
          command: ["python", "-u", "/app/cutter.py"]
          env:
            - {name: UPSTREAM, value: "http://resume-poc-vllm:8000"}
            - {name: CUT_AFTER, value: ""}
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: app, mountPath: /app}]
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - {name: app, configMap: {name: resume-poc-cutter}}
---
apiVersion: v1
kind: Service
metadata:
  name: resume-poc-cutter
  labels: {app.kubernetes.io/part-of: resume-poc}
spec:
  selector: {app: resume-poc-cutter}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resume-poc-processor
  labels: {app.kubernetes.io/part-of: resume-poc}
data:
  transport.json: |
    {"poll_interval_ms": 100, "queues": [
      {"queue_name": "poc", "igw_base_url": "http://resume-poc-cutter:8080",
       "request_path_url": "/v1/chat/completions", "resumable": true,
       "render_url": "http://resume-poc-vllm:8000"}
    ]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-poc-processor
  labels: {app.kubernetes.io/part-of: resume-poc, app: resume-poc-processor}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: resume-poc-processor}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: resume-poc, app: resume-poc-processor}
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets: [{name: resume-poc-quay}]
      containers:
        - name: processor
          image: IMAGE
          args:
            - --data-dir=/data
            - --transport-config-file=/config/transport.json
            - --drain-timeout=3s
          env:
            - {name: RUST_LOG, value: "info,llm_d_async=debug"}
          ports:
            - {name: api, containerPort: 8080}
            - {name: health, containerPort: 8081}
            - {name: metrics, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            periodSeconds: 2
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /config}
          resources:
            requests: {cpu: "1", memory: 512Mi}
            limits: {cpu: "4", memory: 2Gi}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: config, configMap: {name: resume-poc-processor}}

