[package]
name = "llm-d-async"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Asynchronous dispatch processor for llm-d backed by an embedded store"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
futures-core = "0.3"
httpdate = "1.0"
native-tls = "0.2"
object_store = { version = "0.14", default-features = false, features = ["aws-base", "gcp-base", "azure-base", "fs", "reqwest", "ring", "tokio"] }
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
postgres-native-tls = "0.5"
prometheus = { version = "0.14", default-features = false }
rand = "0.9"
redb = "4.3"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "rt"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "multipart"] }
tempfile = "3"
tokio = { version = "1.53", features = ["process"] }
